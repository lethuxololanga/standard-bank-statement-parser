<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useRef, useMemo } = React;

// ── PDF extraction ────────────────────────────────────────────────────────────

async function extractItems(pdf, onPageDone) {
    const allItems = [];
    let yOffset = 0;

    for (let i = 1; i <= pdf.numPages; i++) {
        const page    = await pdf.getPage(i);
        const vp      = page.getViewport({ scale: 1 });
        const content = await page.getTextContent();

        content.items.forEach(item => {
            allItems.push({
                str: item.str,
                x:   item.transform[4],
                y:   yOffset + (vp.height - item.transform[5]),
            });
        });

        yOffset += vp.height + 20;
        onPageDone(i, pdf.numPages);
    }
    return allItems;
}

function itemsToLines(items) {
    const sorted = [...items].sort((a, b) =>
        Math.abs(a.y - b.y) <= 3 ? a.x - b.x : a.y - b.y
    );

    const groups = [];
    for (const item of sorted) {
        const last = groups[groups.length - 1];
        if (last && Math.abs(item.y - last.refY) <= 3) {
            last.items.push(item);
        } else {
            groups.push({ refY: item.y, items: [item] });
        }
    }

    return groups
        .map(g => g.items.map(i => i.str).join(" ").trim())
        .filter(Boolean);
}

// ── Statement period / year logic ─────────────────────────────────────────────

const MONTH_NAMES = {
    january:1, february:2, march:3, april:4, may:5, june:6,
    july:7, august:8, september:9, october:10, november:11, december:12,
};

function parseStatementPeriod(lines) {
    for (const line of lines) {
        const m = line.match(
            /statement\s+from\s+\d{1,2}\s+(\w+)\s+(\d{4})\s+to\s+\d{1,2}\s+(\w+)\s+(\d{4})/i
        );
        if (m) {
            return {
                startMonth: MONTH_NAMES[m[1].toLowerCase()] || 1,
                startYear:  parseInt(m[2], 10),
                endMonth:   MONTH_NAMES[m[3].toLowerCase()] || 12,
                endYear:    parseInt(m[4], 10),
            };
        }
    }
    return null;
}

function yearForMonth(month, period) {
    if (!period || period.startYear === period.endYear) {
        return period ? period.startYear : new Date().getFullYear();
    }
    return month >= period.startMonth ? period.startYear : period.endYear;
}

// ── Parser: Standard Bank MyMoBiz ────────────────────────────────────────────

const SKIP_PATTERNS = [
    /^Details\b/i,
    /^Fee Debits/i,
    /BANK STATEMENT/i,
    /VAT Summary/i,
    /Account Summary/i,
    /^Page \d/i,
    /^Opening Balance/i,
    /^Closing Balance/i,
    /^Statement of Account/i,
    /^BALANCE BROUGHT FORWARD/i,
    /^Month-end Balance/i,
    /^##\s+These fees/i,
    /^Total charge/i,
    /^Total VAT/i,
    /^Balance outstanding/i,
    /^This document/i,
    /^Please verify/i,
    /^Please visit/i,
    /^The Standard Bank/i,
    /^VAT Reg/i,
    /^We subscribe/i,
    /^the Ombudsman/i,
    /^Registered credit/i,
];

// <description> [##] <amount[-]> <MM> <DD> <balance[-]>
const ROW_RE = /^(.+?)\s+(?:##\s+)?([\d,]+\.\d{2}-?)\s+(\d{2})\s+(\d{2})\s+([\d,]+\.\d{2}-?)$/;

/**
 * Parse transactions from reconstructed PDF lines.
 * - Joins continuation lines (e.g. merchant reference on next line) into the description.
 * - Returns { transactions, warnings } where warnings are lines that look like
 *   partial/incomplete transaction rows that were skipped.
 */
function parseStandardBank(lines, period) {
    const transactions = [];
    const warnings     = [];
    let i = 0;

    while (i < lines.length) {
        const line = lines[i];

        if (!line || SKIP_PATTERNS.some(p => p.test(line))) {
            i++;
            continue;
        }

        const m = line.match(ROW_RE);
        if (m) {
            let description = m[1].replace(/\s*##\s*$/, "").trim();

            // Consume continuation lines immediately following this transaction.
            // A continuation: not empty, not a skip pattern, not another full row.
            let j = i + 1;
            while (j < lines.length) {
                const next = lines[j];
                if (!next || SKIP_PATTERNS.some(p => p.test(next)) || next.match(ROW_RE)) break;
                description += " " + next.trim();
                j++;
            }

            const amountRaw  = m[2];
            const month      = parseInt(m[3], 10);
            const day        = m[4];
            const balanceRaw = m[5];

            const isDebit = amountRaw.endsWith("-");
            const amount  = parseFloat(amountRaw.replace(/,/g, "").replace("-", "")).toFixed(2);
            const balSign = balanceRaw.endsWith("-") ? "-" : "";
            const balance = balSign + parseFloat(balanceRaw.replace(/,/g, "").replace("-", "")).toFixed(2);
            const year    = yearForMonth(month, period);
            const mm      = String(month).padStart(2, "0");

            transactions.push({
                date:        `${mm}/${day}/${year}`,
                description,
                debit:       isDebit ? amount : "",
                credit:      !isDebit ? amount : "",
                balance,
            });

            i = j;
            continue;
        }

        // Flag lines that contain amount-like patterns but don't form a complete row —
        // these are genuinely incomplete/orphaned entries in the PDF.
        if (/[\d,]+\.\d{2}-?/.test(line)) {
            warnings.push(line);
        }

        i++;
    }

    return { transactions, warnings };
}

// ── Date helpers ──────────────────────────────────────────────────────────────

/** Parse MM/DD/YYYY → Date (local) */
function parseRowDate(str) {
    if (!str) return null;
    const [mm, dd, yyyy] = str.split("/").map(Number);
    if (!mm || !dd || !yyyy) return null;
    return new Date(yyyy, mm - 1, dd);
}

/** Parse YYYY-MM-DD (from <input type="date">) → Date (local) */
function parseDateInput(str) {
    if (!str) return null;
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d);
}

// ── CSV ───────────────────────────────────────────────────────────────────────

function toCSV(rows) {
    return [
        ["Date", "Description", "Debit", "Credit", "Balance"].join(","),
        ...rows.map(r =>
            [
                r.date,
                `"${(r.description || "").replace(/"/g, '""')}"`,
                r.debit,
                r.credit,
                r.balance,
            ].join(",")
        ),
    ].join("\n");
}

function fmtR(n) {
    const v = parseFloat(n);
    return isNaN(v)
        ? "0.00"
        : Math.abs(v).toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/** Wrap matched substring in a <mark> for highlighting */
function highlight(text, term) {
    if (!term) return text;
    const idx = text.toLowerCase().indexOf(term.toLowerCase());
    if (idx === -1) return text;
    return (
        <>
            {text.slice(0, idx)}
            <mark>{text.slice(idx, idx + term.length)}</mark>
            {text.slice(idx + term.length)}
        </>
    );
}

// ── UI components ─────────────────────────────────────────────────────────────

function DropZone({ onFile, fileName }) {
    const [dragOver, setDragOver] = useState(false);
    const inputRef = useRef();

    const accept = useCallback(f => {
        if (f && f.type === "application/pdf") onFile(f);
    }, [onFile]);

    return (
        <div
            onDrop={e => { e.preventDefault(); setDragOver(false); accept(e.dataTransfer.files[0]); }}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onClick={() => inputRef.current.click()}
            className={`drop-zone${dragOver ? " drag" : ""}${fileName ? " loaded" : ""}`}
        >
            <input
                ref={inputRef}
                type="file"
                accept="application/pdf"
                style={{display:"none"}}
                onChange={e => accept(e.target.files[0])}
            />
            {fileName ? (
                <>
                    <div className="drop-zone-icon">✓</div>
                    <p className="drop-zone-main">{fileName}</p>
                    <p className="drop-zone-sub">Click to change file</p>
                </>
            ) : (
                <>
                    <div className="drop-zone-icon">📄</div>
                    <p className="drop-zone-main">
                        Drop a PDF here or <span className="drop-zone-link">browse</span>
                    </p>
                    <p className="drop-zone-sub">Standard Bank MyMoBiz statement</p>
                </>
            )}
        </div>
    );
}

function StatsBar({ rows }) {
    const totalDebit  = rows.reduce((s, r) => s + (parseFloat(r.debit)  || 0), 0);
    const totalCredit = rows.reduce((s, r) => s + (parseFloat(r.credit) || 0), 0);
    const net         = totalCredit - totalDebit;

    return (
        <div className="stats-grid">
            <Stat label="Transactions"  value={rows.length}       prefix=""   />
            <Stat label="Total Debits"  value={fmtR(totalDebit)}  prefix="R " />
            <Stat label="Total Credits" value={fmtR(totalCredit)} prefix="R " />
            <Stat label="Net"           value={fmtR(Math.abs(net))} prefix={net < 0 ? "−R " : "R "} />
        </div>
    );
}

function Stat({ label, value, prefix }) {
    return (
        <div className="stat-box">
            <div className="stat-label">{label}</div>
            <div className="stat-value">{prefix}{value}</div>
        </div>
    );
}

function FilterBar({ search, onSearch, dateFrom, dateTo, onDateFrom, onDateTo, onClear, total, showing }) {
    const active = search || dateFrom || dateTo;
    return (
        <div className="filter-bar">
            {/* Search */}
            <div className="filter-group">
                <label className="filter-label">Search description</label>
                <div className="filter-input-wrap">
                    <span className="filter-icon">🔍</span>
                    <input
                        type="text"
                        value={search}
                        onChange={e => onSearch(e.target.value)}
                        placeholder="e.g. CANVA, PAYSHAP…"
                        className="has-icon"
                    />
                    {search && (
                        <button className="filter-clear-x" onClick={() => onSearch("")}>×</button>
                    )}
                </div>
            </div>

            {/* Date from */}
            <div className="filter-group" style={{flex:"0 0 auto", minWidth:"140px"}}>
                <label className="filter-label">From</label>
                <input type="date" value={dateFrom} onChange={e => onDateFrom(e.target.value)} />
            </div>

            {/* Date to */}
            <div className="filter-group" style={{flex:"0 0 auto", minWidth:"140px"}}>
                <label className="filter-label">To</label>
                <input type="date" value={dateTo} onChange={e => onDateTo(e.target.value)} />
            </div>

            {/* Count + clear */}
            <div style={{display:"flex", alignItems:"center", gap:"8px", paddingBottom:"2px"}}>
                {active ? (
                    <>
                        <span className={`filter-count${showing < total ? " active" : ""}`}>
                            {showing} / {total}
                        </span>
                        <button className="btn ghost" style={{padding:"6px 12px"}} onClick={onClear}>
                            Clear
                        </button>
                    </>
                ) : (
                    <span className="filter-count">{total} row{total !== 1 ? "s" : ""}</span>
                )}
            </div>
        </div>
    );
}
function TransactionTable({ entries, onDelete, onAddRow, onChange, search }) {
    const fields  = ["date", "description", "debit", "credit", "balance"];
    const headers = ["Date", "Description", "Debit", "Credit", "Balance"];

    const totalDebit  = entries.reduce((s, { row: r }) => s + (parseFloat(r.debit)  || 0), 0);
    const totalCredit = entries.reduce((s, { row: r }) => s + (parseFloat(r.credit) || 0), 0);

    return (
        <div className="table-wrap">
            <div className="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th className="right" style={{width:"36px"}}>#</th>
                            {headers.map(h => <th key={h}>{h}</th>)}
                            <th style={{width:"32px"}}></th>
                        </tr>
                    </thead>
                    <tbody>
                        {entries.map(({ row: r, idx }) => (
                            <tr key={idx} className="group">
                                <td className="td-num">{idx + 1}</td>
                                {fields.map(f => (
                                    <td key={f}>
                                        {f === "description" ? (
                                            <div style={{padding:"2px 4px", fontSize:"13px"}}>
                                                {highlight(r[f] || "", search)}
                                            </div>
                                        ) : (
                                            <input
                                                value={r[f] || ""}
                                                onChange={e => onChange(idx, f, e.target.value)}
                                                className={
                                                    f === "debit"   && r.debit  ? "td-debit"   :
                                                    f === "credit"  && r.credit ? "td-credit"  :
                                                    f === "balance"             ? "td-balance"  : ""
                                                }
                                            />
                                        )}
                                    </td>
                                ))}
                                <td style={{textAlign:"center"}}>
                                    <button
                                        className="del-btn"
                                        onClick={() => onDelete(idx)}
                                        title="Delete row"
                                    >×</button>
                                </td>
                            </tr>
                        ))}
                        {entries.length === 0 && (
                            <tr>
                                <td colSpan={7} style={{textAlign:"center", padding:"40px", color:"var(--text-dim)"}}>
                                    No transactions match your filters.
                                </td>
                            </tr>
                        )}
                    </tbody>
                    <tfoot>
                        <tr>
                            <td></td>
                            <td colSpan={2} style={{textAlign:"right", fontSize:"10px", textTransform:"uppercase", letterSpacing:"0.08em"}}>Totals</td>
                            <td className="td-debit">R {fmtR(totalDebit)}</td>
                            <td className="td-credit">R {fmtR(totalCredit)}</td>
                            <td></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div className="table-footer">
                <button className="add-row-btn" onClick={onAddRow}>+ Add row</button>
            </div>
        </div>
    );
}

function WarningsPanel({ warnings }) {
    const [open, setOpen] = useState(true);
    if (!warnings.length) return null;
    return (
        <div className="panel warn">
            <button className="panel-toggle" onClick={() => setOpen(o => !o)}>
                <span>⚠</span>
                <span>{warnings.length} incomplete row{warnings.length !== 1 ? "s" : ""} skipped</span>
                <span className="ml">{open ? "▲ hide" : "▼ show"}</span>
            </button>
            {open && (
                <div className="panel-body">
                    <p className="panel-desc">
                        These lines were found in the PDF but couldn't be parsed as complete transactions (missing date or balance).
                    </p>
                    {warnings.map((w, i) => (
                        <div key={i} className="warn-line">{w}</div>
                    ))}
                </div>
            )}
        </div>
    );
}

function RawLinesPanel({ lines }) {
    const [open, setOpen] = useState(false);
    if (!lines.length) return null;
    return (
        <div className="panel" style={{marginTop:"16px"}}>
            <button className="panel-toggle" onClick={() => setOpen(o => !o)}>
                <span>{open ? "▼" : "▶"}</span>
                <span>Raw PDF lines ({lines.length})</span>
                <span className="ml">expand to diagnose parsing</span>
            </button>
            {open && (
                <div className="panel-body">
                    <pre className="raw-lines">
                        {lines.map((l, i) => `${String(i + 1).padStart(4)} │ ${l}`).join("\n")}
                    </pre>
                </div>
            )}
        </div>
    );
}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
    const [file,     setFile]     = useState(null);
    const [rows,     setRows]     = useState([]);
    const [status,   setStatus]   = useState("");
    const [busy,     setBusy]     = useState(false);
    const [progress, setProgress] = useState({ current: 0, total: 0 });
    const [error,    setError]    = useState("");
    const [rawLines, setRawLines] = useState([]);
    const [warnings, setWarnings] = useState([]);
    const [copied,   setCopied]   = useState(false);
    const [resetKey, setResetKey] = useState(0);
    const [theme,    setTheme]    = useState(() => {
        const saved = localStorage.getItem("sf-theme");
        return saved || "dark";
    });

    // Apply theme to <html> element
    React.useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("sf-theme", theme);
    }, [theme]);

    function toggleTheme() {
        setTheme(t => t === "dark" ? "light" : "dark");
    }

    // Filter state
    const [search,   setSearch]   = useState("");
    const [dateFrom, setDateFrom] = useState("");
    const [dateTo,   setDateTo]   = useState("");

    // Filtered entries: { row, idx }[] — idx is the original index in `rows`
    const filteredEntries = useMemo(() => {
        const from = parseDateInput(dateFrom);
        const to   = parseDateInput(dateTo);

        return rows
            .map((row, idx) => ({ row, idx }))
            .filter(({ row }) => {
                if (search && !row.description.toLowerCase().includes(search.toLowerCase())) return false;
                if (from || to) {
                    const d = parseRowDate(row.date);
                    if (!d) return true;
                    if (from && d < from) return false;
                    if (to) {
                        const toEnd = new Date(to); toEnd.setHours(23, 59, 59, 999);
                        if (d > toEnd) return false;
                    }
                }
                return true;
            });
    }, [rows, search, dateFrom, dateTo]);

    const filteredRows = filteredEntries.map(e => e.row);
    const filtersActive = !!(search || dateFrom || dateTo);

    async function extract() {
        if (!file) return;
        setBusy(true);
        setError("");
        setRawLines([]);
        setWarnings([]);
        setStatus("Loading PDF…");
        setProgress({ current: 0, total: 0 });

        try {
            const buffer = await file.arrayBuffer();
            const pdf    = await pdfjsLib.getDocument({ data: buffer }).promise;

            setProgress({ current: 0, total: pdf.numPages });

            const allItems = await extractItems(pdf, (current, total) => {
                setProgress({ current, total });
                setStatus(`Reading page ${current} of ${total}…`);
            });

            const lines = itemsToLines(allItems);
            setRawLines(lines);

            const period = parseStatementPeriod(lines);
            const periodLabel = period
                ? `${period.startMonth}/${period.startYear} → ${period.endMonth}/${period.endYear}`
                : "period unknown";

            setStatus(`Parsing transactions (${periodLabel})…`);

            const { transactions, warnings } = parseStandardBank(lines, period);
            setWarnings(warnings);

            if (transactions.length === 0) {
                throw new Error(
                    "No transactions found. Expand 'Raw PDF lines' below to inspect what was extracted."
                );
            }

            setRows(transactions);
            setSearch(""); setDateFrom(""); setDateTo("");
            setStatus(`✓ ${transactions.length} transaction${transactions.length !== 1 ? "s" : ""} extracted  ·  ${periodLabel}`);
        } catch (e) {
            setError(e.message);
            setRows([]);
        } finally {
            setBusy(false);
        }
    }

    function downloadCSV() {
        const exportRows = filtersActive ? filteredRows : rows;
        const blob = new Blob([toCSV(exportRows)], { type: "text/csv" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href     = url;
        a.download = (file?.name || "statement").replace(/\.pdf$/i, "") +
                     (filtersActive ? "_filtered" : "") + ".csv";
        a.click();
        URL.revokeObjectURL(url);
    }

    async function copyCSV() {
        try {
            const exportRows = filtersActive ? filteredRows : rows;
            await navigator.clipboard.writeText(toCSV(exportRows));
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
        } catch {
            setError("Clipboard access denied — use Download instead.");
        }
    }

    function handleChange(originalIdx, field, value) {
        setRows(prev => prev.map((r, i) => i === originalIdx ? { ...r, [field]: value } : r));
    }

    function handleDelete(originalIdx) {
        setRows(prev => prev.filter((_, i) => i !== originalIdx));
    }

    function handleAddRow() {
        setRows(prev => [...prev, { date: "", description: "", debit: "", credit: "", balance: "" }]);
    }

    function handleFileSelected(f) {
        setFile(f);
        setRows([]);
        setError("");
        setStatus("");
        setRawLines([]);
        setWarnings([]);
        setSearch(""); setDateFrom(""); setDateTo("");
    }

    function handleReset() {
        handleFileSelected(null);
        setResetKey(k => k + 1);
    }

    const hasData = rows.length > 0;

    return (
        <div className="page-wrap">

            {/* Nav breadcrumb */}
            <div className="top-nav">
                <a href="index.html">StatementFlow</a>
                <span className="top-nav-sep">›</span>
                <span style={{color:"var(--text-muted)"}}>Standard Bank Converter</span>
                <button className="theme-toggle" onClick={toggleTheme}>
                    <span className="theme-toggle-icon">{theme === "dark" ? "☀" : "☾"}</span>
                    {theme === "dark" ? "Light" : "Dark"}
                </button>
            </div>

            {/* Header */}
            <div className="page-header">
                <div className="page-title">
                    {/* <span className="page-title-icon">▣</span> */}
                    <img src="https://cdn.brandfetch.io/idDKBygDQO/theme/light/symbol.svg?c=1bxid64Mup7aczewSAYMX&t=1668074901080" alt="StatementFlow" style={{width:'32px',height:'32px',objectFit:'contain'}} />
                    <h2>PDF → CSV</h2>
                </div>
                <p className="page-subtitle">Transform your Standard Bank statement into clean, structured data - instantly.</p>
            </div>

            <DropZone key={resetKey} onFile={handleFileSelected} fileName={file?.name} />

            {/* Action buttons */}
            <div className="action-row">
                <button
                    className="btn primary"
                    onClick={extract}
                    disabled={!file || busy}
                >
                    {busy ? `Processing ${progress.current}/${progress.total}…` : "Extract transactions"}
                </button>

                {hasData && (
                    <>
                        <button className="btn" onClick={downloadCSV}>
                            ↓ {filtersActive ? "Download filtered CSV" : "Download CSV"}
                        </button>
                        <button className="btn" onClick={copyCSV}>
                            {copied ? "✓ Copied!" : filtersActive ? "Copy filtered CSV" : "Copy CSV"}
                        </button>
                    </>
                )}

                {(file || hasData) && (
                    <button className="btn ghost push" onClick={handleReset}>Clear</button>
                )}
            </div>

            {/* Status / error */}
            {status && !error && <div className="banner">{status}</div>}
            {error && <div className="banner error">⚠ {error}</div>}

            {hasData && <StatsBar rows={filteredRows} />}
            {hasData && <WarningsPanel warnings={warnings} />}
            {hasData && (
                <FilterBar
                    search={search}       onSearch={setSearch}
                    dateFrom={dateFrom}   onDateFrom={setDateFrom}
                    dateTo={dateTo}       onDateTo={setDateTo}
                    onClear={() => { setSearch(""); setDateFrom(""); setDateTo(""); }}
                    total={rows.length}
                    showing={filteredEntries.length}
                />
            )}
            {hasData && (
                <TransactionTable
                    entries={filteredEntries}
                    search={search}
                    onChange={handleChange}
                    onDelete={handleDelete}
                    onAddRow={handleAddRow}
                />
            )}

            <RawLinesPanel lines={rawLines} />

            <div className="page-footnote">
                <p>Runs entirely in your browser — no data is uploaded anywhere.</p>
                <p>StatementFlow is developed by <span>Lethu Langa</span></p>
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
