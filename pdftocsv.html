<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF → CSV Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useRef, useMemo } = React;

// ── PDF extraction ────────────────────────────────────────────────────────────

async function extractItems(pdf, onPageDone) {
    const allItems = [];
    let yOffset = 0;

    for (let i = 1; i <= pdf.numPages; i++) {
        const page    = await pdf.getPage(i);
        const vp      = page.getViewport({ scale: 1 });
        const content = await page.getTextContent();

        content.items.forEach(item => {
            allItems.push({
                str: item.str,
                x:   item.transform[4],
                y:   yOffset + (vp.height - item.transform[5]),
            });
        });

        yOffset += vp.height + 20;
        onPageDone(i, pdf.numPages);
    }
    return allItems;
}

function itemsToLines(items) {
    const sorted = [...items].sort((a, b) =>
        Math.abs(a.y - b.y) <= 3 ? a.x - b.x : a.y - b.y
    );

    const groups = [];
    for (const item of sorted) {
        const last = groups[groups.length - 1];
        if (last && Math.abs(item.y - last.refY) <= 3) {
            last.items.push(item);
        } else {
            groups.push({ refY: item.y, items: [item] });
        }
    }

    return groups
        .map(g => g.items.map(i => i.str).join(" ").trim())
        .filter(Boolean);
}

// ── Statement period / year logic ─────────────────────────────────────────────

const MONTH_NAMES = {
    january:1, february:2, march:3, april:4, may:5, june:6,
    july:7, august:8, september:9, october:10, november:11, december:12,
};

function parseStatementPeriod(lines) {
    for (const line of lines) {
        const m = line.match(
            /statement\s+from\s+\d{1,2}\s+(\w+)\s+(\d{4})\s+to\s+\d{1,2}\s+(\w+)\s+(\d{4})/i
        );
        if (m) {
            return {
                startMonth: MONTH_NAMES[m[1].toLowerCase()] || 1,
                startYear:  parseInt(m[2], 10),
                endMonth:   MONTH_NAMES[m[3].toLowerCase()] || 12,
                endYear:    parseInt(m[4], 10),
            };
        }
    }
    return null;
}

function yearForMonth(month, period) {
    if (!period || period.startYear === period.endYear) {
        return period ? period.startYear : new Date().getFullYear();
    }
    return month >= period.startMonth ? period.startYear : period.endYear;
}

// ── Parser: Standard Bank MyMoBiz ────────────────────────────────────────────

const SKIP_PATTERNS = [
    /^Details\b/i,
    /^Fee Debits/i,
    /BANK STATEMENT/i,
    /VAT Summary/i,
    /Account Summary/i,
    /^Page \d/i,
    /^Opening Balance/i,
    /^Closing Balance/i,
    /^Statement of Account/i,
    /^BALANCE BROUGHT FORWARD/i,
    /^Month-end Balance/i,
    /^##\s+These fees/i,
    /^Total charge/i,
    /^Total VAT/i,
    /^Balance outstanding/i,
    /^This document/i,
    /^Please verify/i,
    /^Please visit/i,
    /^The Standard Bank/i,
    /^VAT Reg/i,
    /^We subscribe/i,
    /^the Ombudsman/i,
    /^Registered credit/i,
];

// <description> [##] <amount[-]> <MM> <DD> <balance[-]>
const ROW_RE = /^(.+?)\s+(?:##\s+)?([\d,]+\.\d{2}-?)\s+(\d{2})\s+(\d{2})\s+([\d,]+\.\d{2}-?)$/;

/**
 * Parse transactions from reconstructed PDF lines.
 * - Joins continuation lines (e.g. merchant reference on next line) into the description.
 * - Returns { transactions, warnings } where warnings are lines that look like
 *   partial/incomplete transaction rows that were skipped.
 */
function parseStandardBank(lines, period) {
    const transactions = [];
    const warnings     = [];
    let i = 0;

    while (i < lines.length) {
        const line = lines[i];

        if (!line || SKIP_PATTERNS.some(p => p.test(line))) {
            i++;
            continue;
        }

        const m = line.match(ROW_RE);
        if (m) {
            let description = m[1].replace(/\s*##\s*$/, "").trim();

            // Consume continuation lines immediately following this transaction.
            // A continuation: not empty, not a skip pattern, not another full row.
            let j = i + 1;
            while (j < lines.length) {
                const next = lines[j];
                if (!next || SKIP_PATTERNS.some(p => p.test(next)) || next.match(ROW_RE)) break;
                description += " " + next.trim();
                j++;
            }

            const amountRaw  = m[2];
            const month      = parseInt(m[3], 10);
            const day        = m[4];
            const balanceRaw = m[5];

            const isDebit = amountRaw.endsWith("-");
            const amount  = parseFloat(amountRaw.replace(/,/g, "").replace("-", "")).toFixed(2);
            const balSign = balanceRaw.endsWith("-") ? "-" : "";
            const balance = balSign + parseFloat(balanceRaw.replace(/,/g, "").replace("-", "")).toFixed(2);
            const year    = yearForMonth(month, period);
            const mm      = String(month).padStart(2, "0");

            transactions.push({
                date:        `${mm}/${day}/${year}`,
                description,
                debit:       isDebit ? amount : "",
                credit:      !isDebit ? amount : "",
                balance,
            });

            i = j;
            continue;
        }

        // Flag lines that contain amount-like patterns but don't form a complete row —
        // these are genuinely incomplete/orphaned entries in the PDF.
        if (/[\d,]+\.\d{2}-?/.test(line)) {
            warnings.push(line);
        }

        i++;
    }

    return { transactions, warnings };
}

// ── Date helpers ──────────────────────────────────────────────────────────────

/** Parse MM/DD/YYYY → Date (local) */
function parseRowDate(str) {
    if (!str) return null;
    const [mm, dd, yyyy] = str.split("/").map(Number);
    if (!mm || !dd || !yyyy) return null;
    return new Date(yyyy, mm - 1, dd);
}

/** Parse YYYY-MM-DD (from <input type="date">) → Date (local) */
function parseDateInput(str) {
    if (!str) return null;
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d);
}

// ── CSV ───────────────────────────────────────────────────────────────────────

function toCSV(rows) {
    return [
        ["Date", "Description", "Debit", "Credit", "Balance"].join(","),
        ...rows.map(r =>
            [
                r.date,
                `"${(r.description || "").replace(/"/g, '""')}"`,
                r.debit,
                r.credit,
                r.balance,
            ].join(",")
        ),
    ].join("\n");
}

function fmtR(n) {
    const v = parseFloat(n);
    return isNaN(v)
        ? "0.00"
        : Math.abs(v).toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/** Wrap matched substring in a <mark> for highlighting */
function highlight(text, term) {
    if (!term) return text;
    const idx = text.toLowerCase().indexOf(term.toLowerCase());
    if (idx === -1) return text;
    return (
        <>
            {text.slice(0, idx)}
            <mark className="bg-yellow-200 rounded px-0.5">{text.slice(idx, idx + term.length)}</mark>
            {text.slice(idx + term.length)}
        </>
    );
}

// ── UI components ─────────────────────────────────────────────────────────────

function DropZone({ onFile, fileName }) {
    const [dragOver, setDragOver] = useState(false);
    const inputRef = useRef();

    const accept = useCallback(f => {
        if (f && f.type === "application/pdf") onFile(f);
    }, [onFile]);

    return (
        <div
            onDrop={e => { e.preventDefault(); setDragOver(false); accept(e.dataTransfer.files[0]); }}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onClick={() => inputRef.current.click()}
            className={`
                border-2 border-dashed rounded-2xl p-10 text-center cursor-pointer
                transition-all duration-150 select-none
                ${dragOver
                    ? "border-blue-500 bg-blue-50 scale-[1.01]"
                    : fileName
                        ? "border-green-400 bg-green-50"
                        : "border-gray-300 bg-white hover:border-blue-400 hover:bg-blue-50"
                }
            `}
        >
            <input
                ref={inputRef}
                type="file"
                accept="application/pdf"
                className="hidden"
                onChange={e => accept(e.target.files[0])}
            />
            {fileName ? (
                <>
                    <div className="text-4xl mb-2">✅</div>
                    <p className="font-semibold text-gray-700 truncate max-w-sm mx-auto">{fileName}</p>
                    <p className="text-xs text-gray-400 mt-1">Click to change file</p>
                </>
            ) : (
                <>
                    <div className="text-4xl mb-2">📄</div>
                    <p className="text-gray-500">
                        Drop a PDF here or <span className="text-blue-600 underline">browse</span>
                    </p>
                    <p className="text-xs text-gray-400 mt-1">Standard Bank MyMoBiz statement</p>
                </>
            )}
        </div>
    );
}

function StatsBar({ rows }) {
    const totalDebit  = rows.reduce((s, r) => s + (parseFloat(r.debit)  || 0), 0);
    const totalCredit = rows.reduce((s, r) => s + (parseFloat(r.credit) || 0), 0);
    const net         = totalCredit - totalDebit;

    return (
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
            <Stat label="Transactions"  value={rows.length}           color="gray"   prefix=""   />
            <Stat label="Total Debits"  value={fmtR(totalDebit)}      color="red"    prefix="R " />
            <Stat label="Total Credits" value={fmtR(totalCredit)}     color="green"  prefix="R " />
            <Stat
                label="Net"
                value={fmtR(Math.abs(net))}
                color={net >= 0 ? "blue" : "orange"}
                prefix={net < 0 ? "-R " : "R "}
            />
        </div>
    );
}

function Stat({ label, value, color, prefix }) {
    const bg = { gray:"bg-white border-gray-200 text-gray-800", red:"bg-red-50 border-red-100 text-red-700",
                 green:"bg-green-50 border-green-100 text-green-700", blue:"bg-blue-50 border-blue-100 text-blue-700",
                 orange:"bg-orange-50 border-orange-100 text-orange-700" };
    const lc = { gray:"text-gray-400", red:"text-red-400", green:"text-green-500",
                 blue:"text-blue-400", orange:"text-orange-400" };
    return (
        <div className={`rounded-xl p-3 border shadow-sm text-center ${bg[color]}`}>
            <div className={`text-[10px] uppercase tracking-widest mb-1 ${lc[color]}`}>{label}</div>
            <div className="text-xl font-bold tabular-nums">{prefix}{value}</div>
        </div>
    );
}

function FilterBar({ search, onSearch, dateFrom, dateTo, onDateFrom, onDateTo, onClear, total, showing }) {
    const active = search || dateFrom || dateTo;
    return (
        <div className="flex flex-wrap gap-3 items-end mt-4 p-4 bg-white rounded-xl border shadow-sm">
            {/* Search */}
            <div className="flex-1 min-w-48">
                <label className="text-[10px] text-gray-400 uppercase tracking-widest block mb-1">Search description</label>
                <div className="relative">
                    <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none">🔍</span>
                    <input
                        type="text"
                        value={search}
                        onChange={e => onSearch(e.target.value)}
                        placeholder="e.g. CANVA, PAYSHAP…"
                        className="w-full pl-8 pr-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                    />
                    {search && (
                        <button
                            onClick={() => onSearch("")}
                            className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-600 text-lg leading-none"
                        >×</button>
                    )}
                </div>
            </div>

            {/* Date from */}
            <div>
                <label className="text-[10px] text-gray-400 uppercase tracking-widest block mb-1">From</label>
                <input
                    type="date"
                    value={dateFrom}
                    onChange={e => onDateFrom(e.target.value)}
                    className="border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 text-gray-700"
                />
            </div>

            {/* Date to */}
            <div>
                <label className="text-[10px] text-gray-400 uppercase tracking-widest block mb-1">To</label>
                <input
                    type="date"
                    value={dateTo}
                    onChange={e => onDateTo(e.target.value)}
                    className="border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 text-gray-700"
                />
            </div>

            {/* Count + clear */}
            <div className="flex items-center gap-2 pb-0.5">
                {active ? (
                    <>
                        <span className={`text-xs font-medium px-2 py-1 rounded-full ${showing < total ? "bg-yellow-100 text-yellow-700" : "bg-gray-100 text-gray-500"}`}>
                            {showing} of {total}
                        </span>
                        <button
                            onClick={onClear}
                            className="text-xs text-red-400 hover:text-red-600 transition-colors font-medium"
                        >Clear filters</button>
                    </>
                ) : (
                    <span className="text-xs text-gray-400">{total} row{total !== 1 ? "s" : ""}</span>
                )}
            </div>
        </div>
    );
}

function TransactionTable({ entries, onDelete, onAddRow, onChange, search }) {
    const fields  = ["date", "description", "debit", "credit", "balance"];
    const headers = ["Date", "Description", "Debit", "Credit", "Balance"];

    const totalDebit  = entries.reduce((s, { row: r }) => s + (parseFloat(r.debit)  || 0), 0);
    const totalCredit = entries.reduce((s, { row: r }) => s + (parseFloat(r.credit) || 0), 0);

    return (
        <div className="overflow-x-auto rounded-xl border bg-white shadow-sm mt-4">
            <table className="w-full text-sm">
                <thead>
                    <tr className="bg-gray-100 text-gray-500 uppercase text-[11px] tracking-wide">
                        <th className="px-3 py-2 border-b text-right w-8 font-medium">#</th>
                        {headers.map(h => (
                            <th key={h} className="px-2 py-2 border-b text-left font-medium">{h}</th>
                        ))}
                        <th className="px-2 py-2 border-b w-8"></th>
                    </tr>
                </thead>
                <tbody>
                    {entries.map(({ row: r, idx }, displayI) => {
                        const isDebit = !!r.debit;
                        const rowBg = isDebit
                            ? (displayI % 2 === 0 ? "bg-white hover:bg-red-50"   : "bg-red-50/30 hover:bg-red-50")
                            : (displayI % 2 === 0 ? "bg-white hover:bg-green-50" : "bg-green-50/30 hover:bg-green-50");
                        return (
                            <tr key={idx} className={`border-b last:border-0 group transition-colors ${rowBg}`}>
                                <td className="px-3 py-1 text-right text-gray-300 text-xs">{idx + 1}</td>
                                {fields.map(f => (
                                    <td key={f} className="px-1 py-0.5">
                                        {f === "description" ? (
                                            <div className={`px-1.5 py-0.5 text-sm ${search ? "" : ""}`}>
                                                {highlight(r[f] || "", search)}
                                            </div>
                                        ) : (
                                            <input
                                                value={r[f] || ""}
                                                onChange={e => onChange(idx, f, e.target.value)}
                                                className={`
                                                    w-full px-1.5 py-0.5 rounded bg-transparent border-0
                                                    focus:bg-white focus:ring-1 focus:ring-blue-300 outline-none
                                                    ${f === "debit"  && r.debit  ? "text-red-600 font-medium tabular-nums"   : ""}
                                                    ${f === "credit" && r.credit ? "text-green-600 font-medium tabular-nums" : ""}
                                                    ${f === "balance"            ? "text-gray-500 tabular-nums" : ""}
                                                    ${f === "date"               ? "tabular-nums" : ""}
                                                `}
                                            />
                                        )}
                                    </td>
                                ))}
                                <td className="px-2 py-1 text-center">
                                    <button
                                        onClick={() => onDelete(idx)}
                                        title="Delete row"
                                        className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-500 transition-all text-lg leading-none"
                                    >×</button>
                                </td>
                            </tr>
                        );
                    })}
                    {entries.length === 0 && (
                        <tr>
                            <td colSpan={7} className="py-10 text-center text-gray-400 text-sm">
                                No transactions match your filters.
                            </td>
                        </tr>
                    )}
                </tbody>
                <tfoot>
                    <tr className="bg-gray-50 font-semibold border-t-2 border-gray-200 text-sm">
                        <td className="px-3 py-2"></td>
                        <td className="px-2 py-2 text-right text-gray-400 text-xs uppercase tracking-wide" colSpan={2}>Totals</td>
                        <td className="px-2 py-2 text-red-600 tabular-nums">R {fmtR(totalDebit)}</td>
                        <td className="px-2 py-2 text-green-600 tabular-nums">R {fmtR(totalCredit)}</td>
                        <td className="px-2 py-2"></td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
            <div className="px-3 py-2 border-t bg-gray-50 rounded-b-xl">
                <button
                    onClick={onAddRow}
                    className="text-xs text-blue-500 hover:text-blue-700 font-medium transition-colors"
                >+ Add row</button>
            </div>
        </div>
    );
}

function WarningsPanel({ warnings }) {
    const [open, setOpen] = useState(true);
    if (!warnings.length) return null;
    return (
        <div className="mt-4 rounded-xl border border-amber-200 bg-amber-50 overflow-hidden">
            <button
                onClick={() => setOpen(o => !o)}
                className="w-full flex items-center gap-2 px-4 py-3 text-left text-sm font-medium text-amber-800 hover:bg-amber-100 transition-colors"
            >
                <span>⚠</span>
                <span>{warnings.length} incomplete row{warnings.length !== 1 ? "s" : ""} skipped</span>
                <span className="ml-auto text-amber-500 text-xs">{open ? "▲ hide" : "▼ show"}</span>
            </button>
            {open && (
                <div className="px-4 pb-3 space-y-1">
                    <p className="text-xs text-amber-700 mb-2">
                        These lines were found in the PDF but couldn't be parsed as complete transactions (missing date or balance).
                    </p>
                    {warnings.map((w, i) => (
                        <div key={i} className="font-mono text-xs text-amber-900 bg-amber-100 rounded px-2 py-1">{w}</div>
                    ))}
                </div>
            )}
        </div>
    );
}

function RawLinesPanel({ lines }) {
    const [open, setOpen] = useState(false);
    if (!lines.length) return null;
    return (
        <div className="mt-4">
            <button
                onClick={() => setOpen(o => !o)}
                className="text-xs text-gray-400 hover:text-gray-600 transition-colors font-mono"
            >
                {open ? "▼" : "▶"} Raw PDF lines ({lines.length}) — expand to diagnose parsing
            </button>
            {open && (
                <pre className="mt-2 p-4 bg-gray-900 text-green-300 text-xs rounded-xl overflow-auto max-h-72 font-mono leading-5">
                    {lines.map((l, i) => `${String(i + 1).padStart(4)} │ ${l}`).join("\n")}
                </pre>
            )}
        </div>
    );
}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
    const [file,     setFile]     = useState(null);
    const [rows,     setRows]     = useState([]);
    const [status,   setStatus]   = useState("");
    const [busy,     setBusy]     = useState(false);
    const [progress, setProgress] = useState({ current: 0, total: 0 });
    const [error,    setError]    = useState("");
    const [rawLines, setRawLines] = useState([]);
    const [warnings, setWarnings] = useState([]);
    const [copied,   setCopied]   = useState(false);
    const [resetKey, setResetKey] = useState(0);

    // Filter state
    const [search,   setSearch]   = useState("");
    const [dateFrom, setDateFrom] = useState("");
    const [dateTo,   setDateTo]   = useState("");

    // Filtered entries: { row, idx }[] — idx is the original index in `rows`
    const filteredEntries = useMemo(() => {
        const from = parseDateInput(dateFrom);
        const to   = parseDateInput(dateTo);

        return rows
            .map((row, idx) => ({ row, idx }))
            .filter(({ row }) => {
                if (search && !row.description.toLowerCase().includes(search.toLowerCase())) return false;
                if (from || to) {
                    const d = parseRowDate(row.date);
                    if (!d) return true;
                    if (from && d < from) return false;
                    if (to) {
                        const toEnd = new Date(to); toEnd.setHours(23, 59, 59, 999);
                        if (d > toEnd) return false;
                    }
                }
                return true;
            });
    }, [rows, search, dateFrom, dateTo]);

    const filteredRows = filteredEntries.map(e => e.row);
    const filtersActive = !!(search || dateFrom || dateTo);

    async function extract() {
        if (!file) return;
        setBusy(true);
        setError("");
        setRawLines([]);
        setWarnings([]);
        setStatus("Loading PDF…");
        setProgress({ current: 0, total: 0 });

        try {
            const buffer = await file.arrayBuffer();
            const pdf    = await pdfjsLib.getDocument({ data: buffer }).promise;

            setProgress({ current: 0, total: pdf.numPages });

            const allItems = await extractItems(pdf, (current, total) => {
                setProgress({ current, total });
                setStatus(`Reading page ${current} of ${total}…`);
            });

            const lines = itemsToLines(allItems);
            setRawLines(lines);

            const period = parseStatementPeriod(lines);
            const periodLabel = period
                ? `${period.startMonth}/${period.startYear} → ${period.endMonth}/${period.endYear}`
                : "period unknown";

            setStatus(`Parsing transactions (${periodLabel})…`);

            const { transactions, warnings } = parseStandardBank(lines, period);
            setWarnings(warnings);

            if (transactions.length === 0) {
                throw new Error(
                    "No transactions found. Expand 'Raw PDF lines' below to inspect what was extracted."
                );
            }

            setRows(transactions);
            setSearch(""); setDateFrom(""); setDateTo("");
            setStatus(`✓ ${transactions.length} transaction${transactions.length !== 1 ? "s" : ""} extracted  ·  ${periodLabel}`);
        } catch (e) {
            setError(e.message);
            setRows([]);
        } finally {
            setBusy(false);
        }
    }

    function downloadCSV() {
        const exportRows = filtersActive ? filteredRows : rows;
        const blob = new Blob([toCSV(exportRows)], { type: "text/csv" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href     = url;
        a.download = (file?.name || "statement").replace(/\.pdf$/i, "") +
                     (filtersActive ? "_filtered" : "") + ".csv";
        a.click();
        URL.revokeObjectURL(url);
    }

    async function copyCSV() {
        try {
            const exportRows = filtersActive ? filteredRows : rows;
            await navigator.clipboard.writeText(toCSV(exportRows));
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
        } catch {
            setError("Clipboard access denied — use Download instead.");
        }
    }

    function handleChange(originalIdx, field, value) {
        setRows(prev => prev.map((r, i) => i === originalIdx ? { ...r, [field]: value } : r));
    }

    function handleDelete(originalIdx) {
        setRows(prev => prev.filter((_, i) => i !== originalIdx));
    }

    function handleAddRow() {
        setRows(prev => [...prev, { date: "", description: "", debit: "", credit: "", balance: "" }]);
    }

    function handleFileSelected(f) {
        setFile(f);
        setRows([]);
        setError("");
        setStatus("");
        setRawLines([]);
        setWarnings([]);
        setSearch(""); setDateFrom(""); setDateTo("");
    }

    function handleReset() {
        handleFileSelected(null);
        setResetKey(k => k + 1);
    }

    const hasData = rows.length > 0;

    return (
        <div className="max-w-5xl mx-auto px-4 py-8 md:py-12">

            {/* Header */}
            <div className="mb-8">
                <div className="flex items-center gap-3 mb-1">
                    <span className="text-3xl">🏦</span>
                    <h1 className="text-3xl font-bold text-gray-800 tracking-tight">PDF → CSV</h1>
                </div>
                <p className="text-gray-400 text-sm ml-12">
                    Extract Standard Bank MyMoBiz statement transactions to CSV
                </p>
            </div>

            <DropZone key={resetKey} onFile={handleFileSelected} fileName={file?.name} />

            {/* Action buttons */}
            <div className="flex flex-wrap items-center gap-2 mt-4">
                <button
                    onClick={extract}
                    disabled={!file || busy}
                    className="px-5 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-lg font-medium text-sm transition-colors shadow-sm"
                >
                    {busy ? `Processing ${progress.current}/${progress.total}…` : "Extract transactions"}
                </button>

                {hasData && (
                    <>
                        <button
                            onClick={downloadCSV}
                            className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium text-sm transition-colors shadow-sm"
                        >
                            ↓ {filtersActive ? "Download filtered CSV" : "Download CSV"}
                        </button>
                        <button
                            onClick={copyCSV}
                            className="px-5 py-2 bg-violet-600 hover:bg-violet-700 text-white rounded-lg font-medium text-sm transition-colors shadow-sm"
                        >
                            {copied ? "✓ Copied!" : filtersActive ? "Copy filtered CSV" : "Copy CSV"}
                        </button>
                    </>
                )}

                {(file || hasData) && (
                    <button
                        onClick={handleReset}
                        className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg font-medium text-sm transition-colors ml-auto"
                    >Clear</button>
                )}
            </div>

            {/* Status / error */}
            {status && !error && (
                <div className="mt-3 text-sm text-blue-700 bg-blue-50 border border-blue-100 rounded-lg px-4 py-2">
                    {status}
                </div>
            )}
            {error && (
                <div className="mt-3 text-sm text-red-700 bg-red-50 border border-red-100 rounded-lg px-4 py-2">
                    ⚠ {error}
                </div>
            )}

            {/* Stats — always reflects filtered view */}
            {hasData && <StatsBar rows={filteredRows} />}

            {/* Warnings for incomplete rows */}
            {hasData && <WarningsPanel warnings={warnings} />}

            {/* Filter bar */}
            {hasData && (
                <FilterBar
                    search={search}       onSearch={setSearch}
                    dateFrom={dateFrom}   onDateFrom={setDateFrom}
                    dateTo={dateTo}       onDateTo={setDateTo}
                    onClear={() => { setSearch(""); setDateFrom(""); setDateTo(""); }}
                    total={rows.length}
                    showing={filteredEntries.length}
                />
            )}

            {/* Table */}
            {hasData && (
                <TransactionTable
                    entries={filteredEntries}
                    search={search}
                    onChange={handleChange}
                    onDelete={handleDelete}
                    onAddRow={handleAddRow}
                />
            )}

            <RawLinesPanel lines={rawLines} />

            <div className="mt-8 text-center text-xs text-gray-400 space-y-1">
                <p>Runs entirely in your browser — no data is uploaded anywhere.</p>
                <p>Developed by <span className="font-semibold text-gray-500">Lethu Langa</span></p>
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
