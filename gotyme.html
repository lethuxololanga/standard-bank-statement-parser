<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StatementFlow | GoTyme PDF → CSV Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function(){
            var t = localStorage.getItem("sf-theme");
            if (t) document.documentElement.setAttribute("data-theme", t);
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="text/babel" src="asset/shared.js"></script>
    <script defer src="asset/cmdk.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/app.css">
    <link rel="icon" type="image/svg+xml" href="/asset/favicon.svg">
</head>

<body>
<div id="root"></div>

<script type="text/babel">

// ── PDF extraction ─────────────────────────────────────────────────────────────

async function extractItems(pdf, onPageDone) {
    const allItems = [];
    let yOffset = 0;

    for (let i = 1; i <= pdf.numPages; i++) {
        const page    = await pdf.getPage(i);
        const vp      = page.getViewport({ scale: 1 });
        const content = await page.getTextContent();

        content.items.forEach(item => {
            allItems.push({
                str: item.str,
                x:   item.transform[4],
                y:   yOffset + (vp.height - item.transform[5]),
                rot: item.transform[1], // non-zero = rotated (watermark)
            });
        });

        yOffset += vp.height + 20;
        onPageDone(i, pdf.numPages);
    }
    return allItems;
}

function itemsToLines(items) {
    const sorted = [...items].sort((a, b) =>
        Math.abs(a.y - b.y) <= 3 ? a.x - b.x : a.y - b.y
    );

    const groups = [];
    for (const item of sorted) {
        const last = groups[groups.length - 1];
        if (last && Math.abs(item.y - last.refY) <= 3) {
            last.items.push(item);
        } else {
            groups.push({ refY: item.y, items: [item] });
        }
    }

    return groups
        .map(g => g.items.map(i => i.str).join(" ").trim())
        .filter(Boolean);
}

// ── GoTyme parser ──────────────────────────────────────────────────────────────

const MONTH_MAP = {
    jan:1, feb:2, mar:3, apr:4, may:5, jun:6,
    jul:7, aug:8, sep:9, oct:10, nov:11, dec:12,
};

const GOTYME_SKIP_BASE = [
    /^30 Jellicoe/i,
    /^www\.gotyme/i,
    /^0860\s*999/i,
    /^Bank Statement\s*$/i,
    /^Date\s+Details/i,
    /^Credits\s*\(\+\)/i,
    /^Debits\s*\(-\)/i,
    /^Running Balance/i,
    /^Opening balance/i,
    /^Total Credit/i,
    /^Total Debit/i,
    /^Total Fees/i,
    /^Closing balance/i,
    /^Summary\s*$/i,
    /^All figures are in/i,
    /^\*All bank fees/i,
    /^Page \d/i,
    /^You can contact/i,
    /^GoTyme Bank/i,
    /^Hotline:/i,
    /^Email:/i,
    /^Document ID/i,
    /^Date requested/i,
    /^service@gotyme/i,
    /^Period:/i,
    /^Account Number/i,
    /^Current account\s*$/i,
    /^GoalSave Account\s*$/i,
    /^Verified\s*$/i,
    /^[A-Z][A-Z\s]+$/,   // all-caps header lines (account holder name)
    /e-Stamp/i,
    /^Branch:/i,
    /^R\d/,              // summary "R174.14" amounts on their own line
    // Savings-specific
    /^Interest rate/i,
    /^\d+%\s*p\.a\./i,   // "6% p.a."
    /^\d{1,2}\s+\w{3}\s+\d{4}\s+-\s+\d{1,2}\s+\w{3}\s+\d{4}/, // date range "01 Jul 2023 - 31 Dec 2023"
];

// Current account: Date | Details | Fees(-) | Credits(+) | Debits(-) | Balance
const CURRENT_SKIP = [
    ...GOTYME_SKIP_BASE,
    /^Fees\*?\s*\(-\)/i,
];

// Savings account: Date | Details | Credits(+) | Debits(-) | Balance  (no fees col)
const SAVINGS_SKIP = GOTYME_SKIP_BASE;

const NUM = '([\\d,]+(?:\\.\\d+)?|R[\\d,]+(?:\\.\\d+)?|-)';
const CURRENT_ROW_RE = new RegExp(
    `^(\\d{1,2}\\s+[A-Za-z]{3}\\s+\\d{4})\\s+(.+?)\\s+${NUM}\\s+${NUM}\\s+${NUM}\\s+${NUM}$`
);
const SAVINGS_ROW_RE = new RegExp(
    `^(\\d{1,2}\\s+[A-Za-z]{3}\\s+\\d{4})\\s+(.+?)\\s+${NUM}\\s+${NUM}\\s+${NUM}$`
);

function detectStatementType(lines) {
    for (const l of lines) {
        if (/GoalSave Account/i.test(l)) return "savings";
        if (/Current account/i.test(l))  return "current";
    }
    return "current";
}

function parseGoTymeDate(str) {
    const parts = str.trim().split(/\s+/);
    const day  = parts[0].padStart(2, "0");
    const mon  = String(MONTH_MAP[parts[1].toLowerCase().slice(0, 3)] || 1).padStart(2, "0");
    const year = parts[2];
    return `${mon}/${day}/${year}`;
}

function parseAmt(str) {
    if (!str || str === "-") return "";
    const v = parseFloat(str.replace(/^R/, "").replace(/,/g, ""));
    return isNaN(v) ? "" : v.toFixed(2);
}

function parseCurrent(lines) {
    const transactions = [];
    const warnings     = [];

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (!line || CURRENT_SKIP.some(p => p.test(line))) continue;

        const m = line.match(CURRENT_ROW_RE);
        if (m) {
            let desc = m[2].trim();

            let j = i + 1;
            while (j < lines.length) {
                const next = lines[j];
                if (!next || CURRENT_SKIP.some(p => p.test(next)) || next.match(CURRENT_ROW_RE)) break;
                if (/^\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/.test(next)) break;
                desc += " " + next.trim();
                j++;
            }
            i = j - 1;

            const feeAmt = parseAmt(m[3]);
            const credit = parseAmt(m[4]);
            const debAmt = parseAmt(m[5]);
            const balance = parseAmt(m[6]) || "0.00";
            const debitTotal = (parseFloat(feeAmt) || 0) + (parseFloat(debAmt) || 0);

            transactions.push({
                date: parseGoTymeDate(m[1]),
                description: desc,
                debit:   debitTotal > 0 ? debitTotal.toFixed(2) : "",
                credit,
                balance,
            });
            continue;
        }

        if (/[\d,]+\.?\d*/.test(line) && !/^R\d/.test(line)) warnings.push(line);
    }

    return { transactions, warnings };
}

function parseSavings(lines) {
    const transactions = [];
    const warnings     = [];

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (!line || SAVINGS_SKIP.some(p => p.test(line))) continue;

        const m = line.match(SAVINGS_ROW_RE);
        if (m) {
            let desc = m[2].trim();

            let j = i + 1;
            while (j < lines.length) {
                const next = lines[j];
                if (!next || SAVINGS_SKIP.some(p => p.test(next)) || next.match(SAVINGS_ROW_RE)) break;
                if (/^\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/.test(next)) break;
                desc += " " + next.trim();
                j++;
            }
            i = j - 1;

            const credit  = parseAmt(m[3]);
            const debit   = parseAmt(m[4]);
            const balance = parseAmt(m[5]) || "0.00";

            transactions.push({
                date: parseGoTymeDate(m[1]),
                description: desc,
                debit,
                credit,
                balance,
            });
            continue;
        }

        if (/[\d,]+\.?\d*/.test(line) && !/^R\d/.test(line)) warnings.push(line);
    }

    return { transactions, warnings };
}

function parseGoTyme(lines) {
    const type = detectStatementType(lines);
    const result = type === "savings" ? parseSavings(lines) : parseCurrent(lines);
    return { ...result, type };
}

function PasswordModal({ incorrect, onSubmit, onCancel }) {
    const [value, setValue] = useState("");
    const inputRef = useRef();

    React.useEffect(() => { inputRef.current?.focus(); }, []);

    function submit() {
        if (value.trim()) onSubmit(value.trim());
    }

    return (
        <div className="pwd-overlay" onClick={e => e.target === e.currentTarget && onCancel()}>
            <div className="pwd-modal">
                <div className="pwd-title"><i className="ph ph-lock-key"></i> Password-protected PDF</div>
                <div className="pwd-hint">GoTyme statements use your SA ID number as the password.</div>
                {incorrect && <div className="pwd-error">Incorrect password. Try again.</div>}
                <input
                    ref={inputRef}
                    type="password"
                    placeholder="Enter ID number"
                    value={value}
                    onChange={e => setValue(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && submit()}
                />
                <div className="pwd-actions">
                    <button className="btn primary" onClick={submit} disabled={!value.trim()}>
                        Unlock
                    </button>
                    <button className="btn ghost" onClick={onCancel}>Cancel</button>
                </div>
            </div>
        </div>
    );
}

// ── App ────────────────────────────────────────────────────────────────────────

function App() {
    const [file,          setFile]          = useState(null);
    const [rows,          setRows]          = useState([]);
    const [status,        setStatus]        = useState("");
    const [busy,          setBusy]          = useState(false);
    const [progress,      setProgress]      = useState({ current: 0, total: 0 });
    const [error,         setError]         = useState("");
    const [rawLines,      setRawLines]      = useState([]);
    const [warnings,      setWarnings]      = useState([]);
    const [copied,        setCopied]        = useState(false);
    const [resetKey,      setResetKey]      = useState(0);
    const [passwordPrompt, setPasswordPrompt] = useState(null); // { callback, incorrect }
    const [theme, setTheme] = useState(() => localStorage.getItem("sf-theme") || "light");

    React.useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("sf-theme", theme);
    }, [theme]);

    const [search,   setSearch]   = useState("");
    const [dateFrom, setDateFrom] = useState("");
    const [dateTo,   setDateTo]   = useState("");

    const filteredEntries = useMemo(() => {
        const from = parseDateInput(dateFrom);
        const to   = parseDateInput(dateTo);

        return rows
            .map((row, idx) => ({ row, idx }))
            .filter(({ row }) => {
                if (search && !row.description.toLowerCase().includes(search.toLowerCase())) return false;
                if (from || to) {
                    const d = parseRowDate(row.date);
                    if (!d) return true;
                    if (from && d < from) return false;
                    if (to) {
                        const toEnd = new Date(to); toEnd.setHours(23, 59, 59, 999);
                        if (d > toEnd) return false;
                    }
                }
                return true;
            });
    }, [rows, search, dateFrom, dateTo]);

    const filteredRows  = filteredEntries.map(e => e.row);
    const filtersActive = !!(search || dateFrom || dateTo);

    // Stored PDF buffer for re-attempting with password
    const pdfBufferRef = useRef(null);

    async function loadPdf(buffer) {
        setBusy(true);
        setError("");
        setRawLines([]);
        setWarnings([]);
        setStatus("Loading PDF…");
        setProgress({ current: 0, total: 0 });

        try {
            const loadingTask = pdfjsLib.getDocument({ data: buffer });

            loadingTask.onPassword = (callback, reason) => {
                setBusy(false);
                setStatus("");
                setPasswordPrompt({ callback, incorrect: reason === 2 });
            };

            const pdf = await loadingTask.promise;

            setProgress({ current: 0, total: pdf.numPages });

            const allItems = await extractItems(pdf, (current, total) => {
                setProgress({ current, total });
                setStatus(`Reading page ${current} of ${total}…`);
            });

            // ponytail: filter diagonal watermark — rotated items have non-zero transform[1]
            const straightItems = allItems.filter(it => Math.abs(it.rot) < 0.5);
            const lines = itemsToLines(straightItems);
            setRawLines(lines);
            setStatus("Parsing transactions…");

            const { transactions, warnings, type } = parseGoTyme(lines);
            setWarnings(warnings);

            if (transactions.length === 0) {
                throw new Error(
                    "No transactions found. Expand 'Raw PDF lines' below to inspect what was extracted."
                );
            }

            setRows(transactions);
            setSearch(""); setDateFrom(""); setDateTo("");
            const typeLabel = type === "savings" ? "GoalSave / Savings" : "Current Account";
            setStatus(`✓ ${transactions.length} transaction${transactions.length !== 1 ? "s" : ""} extracted  ·  ${typeLabel}`);
        } catch (e) {
            // Password errors are handled via onPassword callback; ignore PasswordException here
            if (e.name !== "PasswordException") {
                setError(e.message);
                setRows([]);
            }
        } finally {
            setBusy(false);
        }
    }

    async function extract() {
        if (!file) return;
        const buffer = await file.arrayBuffer();
        pdfBufferRef.current = buffer;
        await loadPdf(buffer);
    }

    function handlePasswordSubmit(pwd) {
        setPasswordPrompt(null);
        if (passwordPrompt?.callback) {
            setBusy(true);
            setStatus("Unlocking PDF…");
            passwordPrompt.callback(pwd);
        }
    }

    function handlePasswordCancel() {
        setPasswordPrompt(null);
        setStatus("");
        setBusy(false);
    }

    function downloadCSV() {
        const exportRows = filtersActive ? filteredRows : rows;
        const blob = new Blob([toCSV(exportRows)], { type: "text/csv" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href     = url;
        a.download = (file?.name || "statement").replace(/\.pdf$/i, "") +
                     (filtersActive ? "_filtered" : "") + ".csv";
        a.click();
        URL.revokeObjectURL(url);
    }

    async function copyCSV() {
        try {
            const exportRows = filtersActive ? filteredRows : rows;
            await navigator.clipboard.writeText(toCSV(exportRows));
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
        } catch {
            setError("Clipboard access denied. Use Download instead.");
        }
    }

    function handleChange(originalIdx, field, value) {
        setRows(prev => prev.map((r, i) => i === originalIdx ? { ...r, [field]: value } : r));
    }

    function handleDelete(originalIdx) {
        setRows(prev => prev.filter((_, i) => i !== originalIdx));
    }

    function handleAddRow() {
        setRows(prev => [...prev, { date: "", description: "", debit: "", credit: "", balance: "" }]);
    }

    function handleFileSelected(f) {
        setFile(f);
        setRows([]);
        setError("");
        setStatus("");
        setRawLines([]);
        setWarnings([]);
        setPasswordPrompt(null);
        setSearch(""); setDateFrom(""); setDateTo("");
    }

    function handleReset() {
        handleFileSelected(null);
        setResetKey(k => k + 1);
        pdfBufferRef.current = null;
    }

    const hasData = rows.length > 0;

    return (
        <>
        <nav className="nav">
            <div className="container nav-inner">
                <a href="index.html" className="wordmark">StatementFlow<span className="wordmark-dot">.</span></a>
                <div className="nav-links">
                    <a href="standardbank.html">Standard Bank</a>
                    <a href="gotyme.html" className="active">GoTyme</a>
                    <a href="index.html#how-it-works">How it works</a>
                </div>
                <button className="cmdk-pill" data-cmdk-trigger type="button">
                    <i className="ph ph-magnifying-glass"></i>
                    Jump to converter
                    <kbd>⌘K</kbd>
                </button>
                <button className="theme-toggle" onClick={() => setTheme(t => t === "dark" ? "light" : "dark")}>
                    <i className={theme === "dark" ? "ph ph-sun" : "ph ph-moon"}></i>
                    {theme === "dark" ? "Light" : "Dark"}
                </button>
            </div>
        </nav>

        <div className={`page-wrap${hasData ? "" : " page-wrap--empty"}`}>

            {passwordPrompt && (
                <PasswordModal
                    incorrect={passwordPrompt.incorrect}
                    onSubmit={handlePasswordSubmit}
                    onCancel={handlePasswordCancel}
                />
            )}

            <div className="page-header">
                <div className="page-title">
                    <i className="ph ph-file-csv page-title-icon"></i>
                    <h2>PDF → CSV</h2>
                </div>
                <p className="page-subtitle">Transform your GoTyme Bank statement into clean, structured data, instantly. Password-protected PDFs supported.</p>
            </div>

            <DropZone key={resetKey} onFile={handleFileSelected} fileName={file?.name} subtitle="GoTyme Current Account or GoalSave · Password-protected PDFs supported" />

            <div className="action-row">
                <button
                    className="btn primary"
                    onClick={extract}
                    disabled={!file || busy}
                >
                    {busy ? `Processing ${progress.current}/${progress.total}…` : "Extract transactions"}
                </button>

                {hasData && (
                    <>
                        <button className="btn" onClick={downloadCSV}>
                            <i className="ph ph-download-simple"></i> {filtersActive ? "Download filtered CSV" : "Download CSV"}
                        </button>
                        <button className="btn" onClick={copyCSV}>
                            {copied ? <><i className="ph ph-check"></i> Copied!</> : filtersActive ? "Copy filtered CSV" : "Copy CSV"}
                        </button>
                    </>
                )}

                {(file || hasData) && (
                    <button className="btn ghost push" onClick={handleReset}>Clear</button>
                )}
            </div>

            {status && !error && <div className="banner">{status.startsWith("✓ ") ? <><i className="ph ph-check-circle"></i> {status.slice(2)}</> : status}</div>}
            {error  && <div className="banner error"><i className="ph ph-warning"></i> {error}</div>}

            {hasData && <StatsBar rows={filteredRows} />}
            {hasData && <WarningsPanel warnings={warnings} description="Lines found in PDF that couldn't be parsed as complete transactions." />}
            {hasData && (
                <FilterBar
                    search={search}       onSearch={setSearch}
                    dateFrom={dateFrom}   onDateFrom={setDateFrom}
                    dateTo={dateTo}       onDateTo={setDateTo}
                    onClear={() => { setSearch(""); setDateFrom(""); setDateTo(""); }}
                    total={rows.length}
                    showing={filteredEntries.length}
                    searchPlaceholder="e.g. EFT, GoalSave…"
                />
            )}
            {hasData && (
                <TransactionTable
                    entries={filteredEntries}
                    search={search}
                    onChange={handleChange}
                    onDelete={handleDelete}
                    onAddRow={handleAddRow}
                />
            )}

            <RawLinesPanel lines={rawLines} />

        </div>

        <footer className="site-footer">
            <div className="container footer-inner">
                <span className="wordmark" style={{fontSize:"0.9rem"}}>StatementFlow</span>
                <span className="sep">·</span>
                <span>Runs in your browser, no uploads.</span>
                <span className="push"></span>
                <a href="privacy.html">Privacy</a>
                <span className="sep">·</span>
                <a href="terms.html">Terms</a>
                <span className="sep">·</span>
                <a href="mailto:lethu@easystudio.co.za">Contact</a>
            </div>
        </footer>
        </>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
