<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StatementFlow | PDF → CSV Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Anti-flash: apply saved theme before render -->
    <script>
        (function(){
            var t = localStorage.getItem("sf-theme");
            if (t) document.documentElement.setAttribute("data-theme", t);
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="text/babel" src="asset/shared.js"></script>
    <script defer src="asset/cmdk.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/app.css">
    <link rel="icon" type="image/svg+xml" href="/asset/favicon.svg">

</head>

<body>
<div id="root"></div>

<script type="text/babel">
// ── PDF extraction ────────────────────────────────────────────────────────────

async function extractItems(pdf, onPageDone) {
    const allItems = [];
    let yOffset = 0;

    for (let i = 1; i <= pdf.numPages; i++) {
        const page    = await pdf.getPage(i);
        const vp      = page.getViewport({ scale: 1 });
        const content = await page.getTextContent();

        content.items.forEach(item => {
            allItems.push({
                str: item.str,
                x:   item.transform[4],
                y:   yOffset + (vp.height - item.transform[5]),
            });
        });

        yOffset += vp.height + 20;
        onPageDone(i, pdf.numPages);
    }
    return allItems;
}

function itemsToLines(items) {
    const sorted = [...items].sort((a, b) =>
        Math.abs(a.y - b.y) <= 3 ? a.x - b.x : a.y - b.y
    );

    const groups = [];
    for (const item of sorted) {
        const last = groups[groups.length - 1];
        if (last && Math.abs(item.y - last.refY) <= 3) {
            last.items.push(item);
        } else {
            groups.push({ refY: item.y, items: [item] });
        }
    }

    return groups
        .map(g => g.items.map(i => i.str).join(" ").trim())
        .filter(Boolean);
}

// ── Statement period / year logic ─────────────────────────────────────────────

const MONTH_NAMES = {
    january:1, february:2, march:3, april:4, may:5, june:6,
    july:7, august:8, september:9, october:10, november:11, december:12,
};

function parseStatementPeriod(lines) {
    for (const line of lines) {
        const m = line.match(
            /statement\s+from\s+\d{1,2}\s+(\w+)\s+(\d{4})\s+to\s+\d{1,2}\s+(\w+)\s+(\d{4})/i
        );
        if (m) {
            return {
                startMonth: MONTH_NAMES[m[1].toLowerCase()] || 1,
                startYear:  parseInt(m[2], 10),
                endMonth:   MONTH_NAMES[m[3].toLowerCase()] || 12,
                endYear:    parseInt(m[4], 10),
            };
        }
    }
    return null;
}

function yearForMonth(month, period) {
    if (!period || period.startYear === period.endYear) {
        return period ? period.startYear : new Date().getFullYear();
    }
    return month >= period.startMonth ? period.startYear : period.endYear;
}

// ── Parser: Standard Bank MyMoBiz ────────────────────────────────────────────

const SKIP_PATTERNS = [
    /^Details\b/i,
    /^Fee Debits/i,
    /BANK STATEMENT/i,
    /VAT Summary/i,
    /Account Summary/i,
    /^Page \d/i,
    /^Opening Balance/i,
    /^Closing Balance/i,
    /^Statement of Account/i,
    /^BALANCE BROUGHT FORWARD/i,
    /^Month-end Balance/i,
    /^##\s+These fees/i,
    /^Total charge/i,
    /^Total VAT/i,
    /^Balance outstanding/i,
    /^This document/i,
    /^Please verify/i,
    /^Please visit/i,
    /^The Standard Bank/i,
    /^VAT Reg/i,
    /^We subscribe/i,
    /^the Ombudsman/i,
    /^Registered credit/i,
];

// <description> [##] <amount[-]> <MM> <DD> <balance[-]>
const ROW_RE = /^(.+?)\s+(?:##\s+)?([\d,]+\.\d{2}-?)\s+(\d{2})\s+(\d{2})\s+([\d,]+\.\d{2}-?)$/;

/**
 * Parse transactions from reconstructed PDF lines.
 * - Joins continuation lines (e.g. merchant reference on next line) into the description.
 * - Returns { transactions, warnings } where warnings are lines that look like
 *   partial/incomplete transaction rows that were skipped.
 */
function parseStandardBank(lines, period) {
    const transactions = [];
    const warnings     = [];
    let i = 0;

    while (i < lines.length) {
        const line = lines[i];

        if (!line || SKIP_PATTERNS.some(p => p.test(line))) {
            i++;
            continue;
        }

        const m = line.match(ROW_RE);
        if (m) {
            let description = m[1].replace(/\s*##\s*$/, "").trim();

            // Consume continuation lines immediately following this transaction.
            // A continuation: not empty, not a skip pattern, not another full row.
            let j = i + 1;
            while (j < lines.length) {
                const next = lines[j];
                if (!next || SKIP_PATTERNS.some(p => p.test(next)) || next.match(ROW_RE)) break;
                description += " " + next.trim();
                j++;
            }

            const amountRaw  = m[2];
            const month      = parseInt(m[3], 10);
            const day        = m[4];
            const balanceRaw = m[5];

            const isDebit = amountRaw.endsWith("-");
            const amount  = parseFloat(amountRaw.replace(/,/g, "").replace("-", "")).toFixed(2);
            const balSign = balanceRaw.endsWith("-") ? "-" : "";
            const balance = balSign + parseFloat(balanceRaw.replace(/,/g, "").replace("-", "")).toFixed(2);
            const year    = yearForMonth(month, period);
            const mm      = String(month).padStart(2, "0");

            transactions.push({
                date:        `${mm}/${day}/${year}`,
                description,
                debit:       isDebit ? amount : "",
                credit:      !isDebit ? amount : "",
                balance,
            });

            i = j;
            continue;
        }

        // Flag lines that contain amount-like patterns but don't form a complete row —
        // these are genuinely incomplete/orphaned entries in the PDF.
        if (/[\d,]+\.\d{2}-?/.test(line)) {
            warnings.push(line);
        }

        i++;
    }

    return { transactions, warnings };
}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
    const [file,     setFile]     = useState(null);
    const [rows,     setRows]     = useState([]);
    const [status,   setStatus]   = useState("");
    const [busy,     setBusy]     = useState(false);
    const [progress, setProgress] = useState({ current: 0, total: 0 });
    const [error,    setError]    = useState("");
    const [rawLines, setRawLines] = useState([]);
    const [warnings, setWarnings] = useState([]);
    const [copied,   setCopied]   = useState(false);
    const [resetKey, setResetKey] = useState(0);
    const [theme,    setTheme]    = useState(() => {
        const saved = localStorage.getItem("sf-theme");
        return saved || "light";
    });

    // Apply theme to <html> element
    React.useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("sf-theme", theme);
    }, [theme]);

    function toggleTheme() {
        setTheme(t => t === "dark" ? "light" : "dark");
    }

    // Filter state
    const [search,   setSearch]   = useState("");
    const [dateFrom, setDateFrom] = useState("");
    const [dateTo,   setDateTo]   = useState("");

    // Filtered entries: { row, idx }[] — idx is the original index in `rows`
    const filteredEntries = useMemo(() => {
        const from = parseDateInput(dateFrom);
        const to   = parseDateInput(dateTo);

        return rows
            .map((row, idx) => ({ row, idx }))
            .filter(({ row }) => {
                if (search && !row.description.toLowerCase().includes(search.toLowerCase())) return false;
                if (from || to) {
                    const d = parseRowDate(row.date);
                    if (!d) return true;
                    if (from && d < from) return false;
                    if (to) {
                        const toEnd = new Date(to); toEnd.setHours(23, 59, 59, 999);
                        if (d > toEnd) return false;
                    }
                }
                return true;
            });
    }, [rows, search, dateFrom, dateTo]);

    const filteredRows = filteredEntries.map(e => e.row);
    const filtersActive = !!(search || dateFrom || dateTo);

    async function extract() {
        if (!file) return;
        setBusy(true);
        setError("");
        setRawLines([]);
        setWarnings([]);
        setStatus("Loading PDF…");
        setProgress({ current: 0, total: 0 });

        try {
            const buffer = await file.arrayBuffer();
            const pdf    = await pdfjsLib.getDocument({ data: buffer }).promise;

            setProgress({ current: 0, total: pdf.numPages });

            const allItems = await extractItems(pdf, (current, total) => {
                setProgress({ current, total });
                setStatus(`Reading page ${current} of ${total}…`);
            });

            const lines = itemsToLines(allItems);
            setRawLines(lines);

            const period = parseStatementPeriod(lines);
            const periodLabel = period
                ? `${period.startMonth}/${period.startYear} → ${period.endMonth}/${period.endYear}`
                : "period unknown";

            setStatus(`Parsing transactions (${periodLabel})…`);

            const { transactions, warnings } = parseStandardBank(lines, period);
            setWarnings(warnings);

            if (transactions.length === 0) {
                throw new Error(
                    "No transactions found. Expand 'Raw PDF lines' below to inspect what was extracted."
                );
            }

            setRows(transactions);
            setSearch(""); setDateFrom(""); setDateTo("");
            setStatus(`✓ ${transactions.length} transaction${transactions.length !== 1 ? "s" : ""} extracted  ·  ${periodLabel}`);
        } catch (e) {
            setError(e.message);
            setRows([]);
        } finally {
            setBusy(false);
        }
    }

    function downloadCSV() {
        const exportRows = filtersActive ? filteredRows : rows;
        const blob = new Blob([toCSV(exportRows)], { type: "text/csv" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href     = url;
        a.download = (file?.name || "statement").replace(/\.pdf$/i, "") +
                     (filtersActive ? "_filtered" : "") + ".csv";
        a.click();
        URL.revokeObjectURL(url);
    }

    async function copyCSV() {
        try {
            const exportRows = filtersActive ? filteredRows : rows;
            await navigator.clipboard.writeText(toCSV(exportRows));
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
        } catch {
            setError("Clipboard access denied. Use Download instead.");
        }
    }

    function handleChange(originalIdx, field, value) {
        setRows(prev => prev.map((r, i) => i === originalIdx ? { ...r, [field]: value } : r));
    }

    function handleDelete(originalIdx) {
        setRows(prev => prev.filter((_, i) => i !== originalIdx));
    }

    function handleAddRow() {
        setRows(prev => [...prev, { date: "", description: "", debit: "", credit: "", balance: "" }]);
    }

    function handleFileSelected(f) {
        setFile(f);
        setRows([]);
        setError("");
        setStatus("");
        setRawLines([]);
        setWarnings([]);
        setSearch(""); setDateFrom(""); setDateTo("");
    }

    function handleReset() {
        handleFileSelected(null);
        setResetKey(k => k + 1);
    }

    const hasData = rows.length > 0;

    return (
        <>
        <nav className="nav">
            <div className="container nav-inner">
                <a href="index.html" className="wordmark">StatementFlow<span className="wordmark-dot">.</span></a>
                <div className="nav-links">
                    <a href="standardbank.html" className="active">Standard Bank</a>
                    <a href="gotyme.html">GoTyme</a>
                    <a href="index.html#how-it-works">How it works</a>
                </div>
                <button className="cmdk-pill" data-cmdk-trigger type="button">
                    <i className="ph ph-magnifying-glass"></i>
                    Jump to converter
                    <kbd>⌘K</kbd>
                </button>
                <button className="theme-toggle" onClick={toggleTheme}>
                    <i className={theme === "dark" ? "ph ph-sun" : "ph ph-moon"}></i>
                    {theme === "dark" ? "Light" : "Dark"}
                </button>
            </div>
        </nav>

        <div className={`page-wrap${hasData ? "" : " page-wrap--empty"}`}>

            {/* Header */}
            <div className="page-header">
                <div className="page-title">
                    <i className="ph ph-file-csv page-title-icon"></i>
                    <h2>PDF → CSV</h2>
                </div>
                <p className="page-subtitle">Transform your Standard Bank statement into clean, structured data - instantly.</p>
            </div>

            <DropZone key={resetKey} onFile={handleFileSelected} fileName={file?.name} subtitle="Standard Bank MyMoBiz statement" />

            {/* Action buttons */}
            <div className="action-row">
                <button
                    className="btn primary"
                    onClick={extract}
                    disabled={!file || busy}
                >
                    {busy ? `Processing ${progress.current}/${progress.total}…` : "Extract transactions"}
                </button>

                {hasData && (
                    <>
                        <button className="btn" onClick={downloadCSV}>
                            <i className="ph ph-download-simple"></i> {filtersActive ? "Download filtered CSV" : "Download CSV"}
                        </button>
                        <button className="btn" onClick={copyCSV}>
                            {copied ? <><i className="ph ph-check"></i> Copied!</> : filtersActive ? "Copy filtered CSV" : "Copy CSV"}
                        </button>
                    </>
                )}

                {(file || hasData) && (
                    <button className="btn ghost push" onClick={handleReset}>Clear</button>
                )}
            </div>

            {/* Status / error */}
            {status && !error && <div className="banner">{status.startsWith("✓ ") ? <><i className="ph ph-check-circle"></i> {status.slice(2)}</> : status}</div>}
            {error && <div className="banner error"><i className="ph ph-warning"></i> {error}</div>}

            {hasData && <StatsBar rows={filteredRows} />}
            {hasData && <WarningsPanel warnings={warnings} description="These lines were found in the PDF but couldn't be parsed as complete transactions (missing date or balance)." />}
            {hasData && (
                <FilterBar
                    search={search}       onSearch={setSearch}
                    dateFrom={dateFrom}   onDateFrom={setDateFrom}
                    dateTo={dateTo}       onDateTo={setDateTo}
                    onClear={() => { setSearch(""); setDateFrom(""); setDateTo(""); }}
                    total={rows.length}
                    showing={filteredEntries.length}
                    searchPlaceholder="e.g. CANVA, PAYSHAP…"
                />
            )}
            {hasData && (
                <TransactionTable
                    entries={filteredEntries}
                    search={search}
                    onChange={handleChange}
                    onDelete={handleDelete}
                    onAddRow={handleAddRow}
                />
            )}

            <RawLinesPanel lines={rawLines} />

        </div>

        <footer className="site-footer">
            <div className="container footer-inner">
                <span className="wordmark" style={{fontSize:"0.9rem"}}>StatementFlow</span>
                <span className="sep">·</span>
                <span>Runs in your browser, no uploads.</span>
                <span className="push"></span>
                <a href="privacy.html">Privacy</a>
                <span className="sep">·</span>
                <a href="terms.html">Terms</a>
                <span className="sep">·</span>
                <a href="mailto:lethu@easystudio.co.za">Contact</a>
            </div>
        </footer>
        </>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
